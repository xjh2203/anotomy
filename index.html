<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>解剖學互動背單字系統 - 背部肌肉</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-teal-400 bg-clip-text text-transparent">
                    Anatomy Mastery 
                </h1>
                <p class="text-xs text-slate-400">解剖學互動背單字系統（背部肌肉專用）</p>
            </div>
            
            <!-- 分類篩選列 -->
            <div class="flex flex-wrap gap-2 text-sm">
                <button onclick="filterCategory('all')" id="btn-all" class="px-3 py-1.5 rounded-lg bg-blue-600 font-medium transition shadow">全部顯示</button>
                <button onclick="filterCategory('muscle')" id="btn-muscle" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 transition">肌肉</button>
                <button onclick="filterCategory('vessel')" id="btn-vessel" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 transition">血管 (建置中)</button>
                <button onclick="filterCategory('nerve')" id="btn-nerve" class="px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 transition">神經 (建置中)</button>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-6xl mx-auto w-full p-4 md:p-6 space-y-8">

        <!-- 區域導覽列 -->
        <section class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-4 shadow-sm">
            <h2 class="text-sm font-semibold text-slate-400 mb-3 tracking-wider uppercase">選擇身體區域</h2>
            <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-8 gap-2">
                <button onclick="selectRegion('back')" id="reg-back" class="p-2.5 rounded-xl text-center text-sm font-medium bg-blue-600 text-white shadow transition">背部</button>
                <button onclick="selectRegion('upper')" id="reg-upper" class="p-2.5 rounded-xl text-center text-sm font-medium bg-slate-700/50 text-slate-400 hover:bg-slate-700 hover:text-slate-200 transition">上肢</button>
                <button onclick="selectRegion('lower')" id="reg-lower" class="p-2.5 rounded-xl text-center text-sm font-medium bg-slate-700/50 text-slate-400 hover:bg-slate-700 hover:text-slate-200 transition">下肢</button>
                <button onclick="selectRegion('chest')" id="reg-chest" class="p-2.5 rounded-xl text-center text-sm font-medium bg-slate-700/50 text-slate-400 hover:bg-slate-700 hover:text-slate-200 transition">胸部</button>
                <button onclick="selectRegion('abdomen')" id="reg-abdomen" class="p-2.5 rounded-xl text-center text-sm font-medium bg-slate-700/50 text-slate-400 hover:bg-slate-700 hover:text-slate-200 transition">腹部</button>
                <button onclick="selectRegion('neck')" id="reg-neck" class="p-2.5 rounded-xl text-center text-sm font-medium bg-slate-700/50 text-slate-400 hover:bg-slate-700 hover:text-slate-200 transition">頸部</button>
                <button onclick="selectRegion('head')" id="reg-head" class="p-2.5 rounded-xl text-center text-sm font-medium bg-slate-700/50 text-slate-400 hover:bg-slate-700 hover:text-slate-200 transition">頭部</button>
                <button onclick="selectRegion('pelvis')" id="reg-pelvis" class="p-2.5 rounded-xl text-center text-sm font-medium bg-slate-700/50 text-slate-400 hover:bg-slate-700 hover:text-slate-200 transition">骨盆會陰</button>
            </div>
        </section>

        <!-- 狀態與進度控制 -->
        <section class="flex flex-col sm:flex-row justify-between items-center bg-slate-800/40 p-4 rounded-xl border border-slate-700/50 gap-4">
            <div class="flex items-center gap-3">
                <span id="region-title-badge" class="px-3 py-1 rounded-full bg-blue-500/20 text-blue-400 font-semibold text-sm border border-blue-500/30">背部肌肉</span>
                <span id="progress-text" class="text-sm text-slate-400">已解鎖 0 / 24 項構造</span>
            </div>
            <div class="flex gap-2 w-full sm:w-auto">
                <button onclick="revealAll()" class="flex-1 sm:flex-none px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium rounded-lg transition">一鍵全開（偷看答案）</button>
                <button onclick="resetAll()" class="flex-1 sm:flex-none px-4 py-2 bg-rose-950/50 hover:bg-rose-900/60 text-rose-300 border border-rose-800/50 text-sm font-medium rounded-lg transition">全部重設</button>
            </div>
        </section>

        <!-- 區塊容器：依照層次分組顯示 -->
        <div id="layers-container" class="space-y-8">
            <!-- 動態生成層次卡片 -->
        </div>

    </main>

    <!-- 底部版權 -->
    <footer class="text-center py-6 text-xs text-slate-500 border-t border-slate-800 mt-12">
        Anatomy Mastery Learning System &copy; 2026
    </footer>

    <!-- JavaScript 邏輯 -->

        // 一鍵全開（偷看答案）的解鎖函式

  if (typeof backMusclesData !== 'undefined') {
    backMusclesData.forEach(item => {
      item.unlocked = true;
    });
  }
  
  // 如果有更新畫面的函式就呼叫它，否則直接重新整理網頁
  if (typeof updateUI === 'function') {
    updateUI();
  } else {
    location.reload();
  }
}
